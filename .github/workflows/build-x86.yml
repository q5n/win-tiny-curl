name: Build tiny-curl x86

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 x86
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            curl
            unzip
            zip
            mingw-w64-i686-toolchain
            mingw-w64-i686-autotools

      - name: Build x86 package
        shell: msys2 {0}
        env:
          TARGET_ARCH: x86
        run: bash .github/scripts/build.sh

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path dist -Filter *.zip | ForEach-Object FullName
          if ($assets.Count -ne 1) { throw "Expected one ZIP asset, found $($assets.Count)." }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            $assetBase = $env:ARTIFACT_NAME
            gh release delete-asset $env:RELEASE_TAG "$assetBase-cookies.zip" --yes 2> $null
            gh release delete-asset $env:RELEASE_TAG "$assetBase-no-cookies.zip" --yes 2> $null
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TITLE `
              --generate-notes `
              --latest
          }
